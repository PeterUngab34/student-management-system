name: Deploy web edition to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sql/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install test dependencies
        working-directory: web
        run: npm ci

      - name: Sync the seed from sql/seed.sql (single source of truth)
        run: node web/scripts/sync-seed.mjs

      - name: Unit tests (schema, seed counts, GPA rules, validation)
        working-directory: web
        run: npm test

      - name: Build the Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude node_modules --exclude tests --exclude scripts --exclude package.json --exclude package-lock.json --exclude .gitignore web/ _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
